<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coding Practice | CodeBase</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <!-- Code Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent-primary: #6366f1;
      --accent-secondary: #ec4899;
      --success: #10b981;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 40px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .main-container {
      flex: 1;
      padding: 40px;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .practice-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .practice-header h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
    }

    .stat-val {
      display: block;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-primary);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .code-container {
      position: relative;
      background: #1e1e2e;
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .code-display {
      padding: 32px;
      font-family: 'Fira Code', monospace;
      font-size: 18px;
      line-height: 1.6;
      color: var(--text-muted);
      position: relative;
      user-select: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .code-display .virtual-newline {
        display: block;
        height: 0;
        margin: 0;
        content: "";
    }
    
    .code-display .extra-char {
        color: var(--danger);
        opacity: 0.6;
    }

    .code-display .correct {
      color: var(--text-main);
      background: rgba(16, 185, 129, 0.1);
    }

    .code-display .incorrect {
      color: var(--danger);
      background: rgba(239, 68, 104, 0.2);
    }
    
    .code-display span.pending-type {
        color: var(--text-main);
        background: rgba(255,255,255,0.05);
    }

    .code-display .current {
      background: rgba(99, 102, 241, 0.2);
      border-left: 2px solid var(--accent-primary);
      color: transparent !important;
      z-index: 1;
    }

    /* Split View for Level 1 */
    .split-mode {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        gap: 0;
    }
    .typing-side {
        display: flex;
        position: relative;
        overflow: hidden;
    }
    .reference-side {
        border-left: 1px solid var(--glass-border);
        background: rgba(0,0,0,0.1);
        overflow-y: auto;
        position: relative;
    }
    .reference-label {
        position: sticky;
        top: 0;
        right: 0;
        padding: 4px 12px;
        background: var(--accent-primary);
        color: white;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        border-bottom-left-radius: 8px;
        z-index: 10;
        float: right;
    }
    .line-correct {
        background: rgba(16, 185, 129, 0.15) !important;
        color: #10b981 !important;
    }

    .line-numbers {
        padding: 32px 12px;
        background: rgba(0,0,0,0.2);
        border-right: 1px solid var(--glass-border);
        color: #4b5563;
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        text-align: right;
        user-select: none;
        min-width: 60px;
    }
    
    .line-numbers div {
        height: 28.8px; /* Matches line height of code-display */
    }

    .active-line-bg {
        position: absolute;
        left: 0;
        right: 0;
        height: 28.8px; 
        background: rgba(255,255,255,0.03);
        pointer-events: none;
        transition: top 0.1s;
        z-index: 0;
    }

    .progress-top {
        position: absolute;
        top: 0;
        left: 0;
        height: 3px;
        background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
        width: 0%;
        transition: width 0.3s;
        z-index: 100;
    }

    .shake {
        animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    /* Indentation Guides */
    .code-display {
        background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 4ch 100%; /* 4ch matches standard 4-space indent */
        background-position: 32px 0; /* Match padding */
    }

    .code-display span.bracket-match {
        background: rgba(99, 102, 241, 0.4) !important;
        outline: 1px solid var(--accent-primary);
        color: white !important;
        border-radius: 2px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Level Mode Styles */
    .level1-mode span:not(.correct):not(.incorrect):not(.current):not(.user-inserted):not(.pending-type) {
        opacity: 0;
    }
    
    .level-select {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .level-pill {
      padding: 10px 24px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 50px;
      cursor: pointer;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.3s;
      font-size: 0.85rem;
    }
    .level-pill:hover {
      background: rgba(255,255,255,0.1);
    }
    .level-pill.active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: white;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
    }

    /* Memory Mode (Level 2) */
    .memory-mode span:not(.correct):not(.incorrect):not(.current) {
      color: transparent !important;
      background: transparent !important;
    }
    .memory-mode.show-hint span:not(.correct):not(.incorrect):not(.current) {
      color: rgba(148, 163, 184, 0.2) !important;
      transition: color 0.5s ease;
    }
    
    .memory-mode span.correct {
      background: rgba(16, 185, 129, 0.1) !important;
    }
    .memory-mode span.incorrect {
      color: var(--danger) !important;
      background: rgba(239, 68, 104, 0.2) !important;
    }
    .memory-mode span.current {
      color: rgba(255, 255, 255, 0.5) !important;
      background: rgba(99, 102, 241, 0.3) !important;
      border-bottom: 2px solid var(--accent-primary);
    }

    /* Blind Mode (Level 3) */
    .blind-mode span:not(.correct):not(.incorrect):not(.current) {
      color: transparent !important;
      background: transparent !important;
      border-bottom: none !important;
    }
    .blind-mode span.current {
      background: var(--accent-secondary) !important;
      color: white !important;
      opacity: 1 !important;
    }
    .blind-mode span.correct {
        color: #10b981 !important;
        background: rgba(16, 185, 129, 0.1) !important;
    }
    .blind-mode span.incorrect {
        color: var(--danger) !important;
        background: rgba(239, 68, 104, 0.2) !important;
    }

    /* Syntax Highlighting Colors (Override hljs to match interactive spans) */
    .hljs-keyword, .hljs-selector-tag { color: #c678dd; font-weight: bold; }
    .hljs-string { color: #98c379; }
    .hljs-number { color: #d19a66; }
    .hljs-function, .hljs-title { color: #61afef; }
    .hljs-comment { color: #5c6370; font-style: italic; }
    .hljs-attr { color: #d19a66; }
    .hljs-property { color: #61afef; }
    
    #hiddenInput {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .focus-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: pointer;
      transition: opacity 0.3s;
    }

    .focus-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .focus-msg {
      padding: 16px 32px;
      background: var(--accent-primary);
      border-radius: 14px;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
    }

    .congrats-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }

    .congrats-modal.active {
      display: flex;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 48px;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .modal-content h2 {
      font-size: 2.5rem;
      margin-bottom: 16px;
      background: linear-gradient(to right, var(--success), var(--accent-primary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .action-btn {
      margin-top: 32px;
      padding: 14px 40px;
      background: var(--accent-primary);
      color: white;
      border: none;
      border-radius: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
    }
  </style>
</head>

<body>
  <header>
    <a href="resources.html" class="back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back
    </a>
    <h1 id="coderTitle">Practice Coding</h1>
    <div id="headerActions"></div>
  </header>

  <main class="main-container">
    <div class="practice-header">
      <h1 id="practiceTitle">Loading...</h1>
      <p style="color: var(--text-muted); margin-top: 8px;">Type the code exactly as shown to master the syntax.</p>
    </div>

    <div class="level-select">
      <div class="level-pill active" onclick="setLevel(1)" id="lvl1">Level 1: Typing</div>
      <div class="level-pill" onclick="setLevel(2)" id="lvl2">Level 2: Memory</div>
      <div class="level-pill" onclick="setLevel(3)" id="lvl3">Level 3: Blind</div>
    </div>

    <div class="stats-bar">
      <div class="stat-card">
        <span class="stat-val" id="statAccuracy">100%</span>
        <span class="stat-label">Accuracy</span>
      </div>
      <div class="stat-card">
        <span class="stat-val" id="statWPM">0</span>
        <span class="stat-label">WPM</span>
      </div>
      <div class="stat-card">
        <span class="stat-val" id="statProgress">0%</span>
        <span class="stat-label">Progress</span>
      </div>
    </div>

    <div class="code-container" id="editorContainer">
      <div class="progress-top" id="topProgress"></div>
      
      <div class="typing-side" id="typingSide">
        <div class="line-numbers" id="lineNumbers"></div>
        <div id="activeLine" class="active-line-bg"></div>
        <div id="focusOverlay" class="focus-overlay">
          <div class="focus-msg">Click here to start practicing</div>
        </div>
        <div id="codeDisplay" class="code-display"></div>
      </div>
      
      <div class="reference-side" id="referenceSide" style="display: none;">
        <div class="reference-label">Reference</div>
        <div id="referenceDisplay" class="code-display"></div>
      </div>

      <input type="text" id="hiddenInput">
    </div>
  </main>

  <div id="congratsModal" class="congrats-modal">
    <div class="modal-content">
      <h2>Well Done!</h2>
      <p id="finalStats">You completed the practice with 98% accuracy.</p>
      <button class="action-btn" onclick="location.reload()">Practice Again</button>
      <button class="action-btn" style="background: var(--glass-bg); border: 1px solid var(--glass-border); margin-left: 10px;" onclick="window.location.href='resources.html'">Finish</button>
    </div>
  </div>

  <script type="module">
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collectionGroup, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
    import { app } from "./assets/js/firebase.js";

    const auth = getAuth(app);
    const db = getFirestore(app);

    const codeDisplay = document.getElementById('codeDisplay');
    const hiddenInput = document.getElementById('hiddenInput');
    const focusOverlay = document.getElementById('focusOverlay');
    
    let targetCode = "";
    let currentIndex = 0;
    let mistakes = 0;
    let startTime = null;
    let isFinished = false;
    let currentLevel = 1;
    let hintTimer = null;

    const urlParams = new URLSearchParams(window.location.search);
    const resourceId = urlParams.get('id');
    const courseId = urlParams.get('courseId');
    const moduleId = urlParams.get('moduleId');

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "login.html"; return; }
      if (!resourceId) { window.location.href = "resources.html"; return; }
      
      // Get user profile for ownership check
      const userSnap = await getDoc(doc(db, "users", user.uid));
      const userData = userSnap.exists() ? userSnap.data() : null;
      
      loadResource(userData);
    });

    async function loadResource(userData) {
      try {
        let snap = null;

        // 1. Try direct path if course/module provided
        if (courseId && moduleId) {
          snap = await getDoc(doc(db, "courses", courseId, "content", moduleId, "resources", resourceId));
        }

        // 2. Try legacy community_resources
        if (!snap || !snap.exists()) {
          snap = await getDoc(doc(db, "community_resources", resourceId));
        }

        // 3. Last resort: collectionGroup scan (slow)
        if (!snap || !snap.exists()) {
          const q = query(collectionGroup(db, "resources"), where("type", "==", "coder"));
          const groupSnap = await getDocs(q);
          const match = groupSnap.docs.find(d => d.id === resourceId);
          if (match) snap = match;
        }

        if (snap && snap.exists()) {
          const data = snap.data();
          targetCode = data.code || "";
          document.getElementById('practiceTitle').textContent = data.title;
          renderCode();

          // Check if user is creator or admin/owner
          const isCreator = userData && (data.uploadedBy === userData.registrationNumber || userData.role === "admin" || userData.role === "owner");
          if (isCreator) {
            const headerActions = document.getElementById('headerActions');
            const editBtn = document.createElement('a');
            editBtn.href = `coder-editor.html?id=${resourceId}${courseId ? '&courseId=' + courseId : ''}${moduleId ? '&moduleId=' + moduleId : ''}`;
            editBtn.className = 'back-btn';
            editBtn.style.background = 'var(--accent-primary)';
            editBtn.style.borderColor = 'var(--accent-primary)';
            editBtn.innerHTML = `
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
              Edit Content
            `;
            headerActions.appendChild(editBtn);
          }
        } else {
          alert("Resource not found!");
          window.location.href = "resources.html";
        }
      } catch (err) {
        console.error("Load failed:", err);
        alert("Error loading resource: " + err.message);
        window.location.href = "resources.html";
      }
    }

    function renderCode() {
      codeDisplay.innerHTML = "";
      const refSide = document.getElementById('referenceSide');
      const refDisplay = document.getElementById('referenceDisplay');
      const container = document.getElementById('editorContainer');
      
      refSide.style.display = "none";
      container.classList.remove('split-mode');
      document.getElementById('lineNumbers').innerHTML = "";
      codeDisplay.className = "code-display"; 

      if (true) {
          container.classList.add('split-mode');
          refSide.style.display = "block";
          // Render Reference
          refDisplay.innerHTML = "";
          const highlighted = hljs.highlightAuto(targetCode).value;
          refDisplay.innerHTML = highlighted;
          
          // ISOLATED MODE: No template spans on the left
          codeDisplay.classList.add('isolated-mode');
          // Add initial cursor
          const cursor = document.createElement('span');
          cursor.classList.add('current');
          cursor.textContent = " "; // invisible space for the bar
          codeDisplay.appendChild(cursor);
      } else {
          // OVERLAY MODE (Level 2 & 3)
          if (currentLevel === 2) codeDisplay.classList.add("memory-mode");
          if (currentLevel === 3) codeDisplay.classList.add("blind-mode");

          // Generate Syntax Highlighted HTML for the typing side
          const highlighted = hljs.highlightAuto(targetCode).value;
          const temp = document.createElement('div');
          temp.innerHTML = highlighted;

          let charIndex = 0;
          function processNode(node, parentClasses = []) {
            if (node.nodeType === 3) {
              const text = node.textContent;
              for (let i = 0; i < text.length; i++) {
                const span = document.createElement('span');
                span.textContent = text[i];
                if (parentClasses.length > 0) parentClasses.forEach(c => span.classList.add(c));
                if (charIndex === 0) span.classList.add("current");
                codeDisplay.appendChild(span);
                charIndex++;
              }
            } else if (node.nodeType === 1) {
              const classes = Array.from(node.classList);
              node.childNodes.forEach(child => processNode(child, [...parentClasses, ...classes]));
            }
          }
          temp.childNodes.forEach(child => processNode(child));
      }

      // Generate Line Numbers
      const lines = targetCode.split('\n').length;
      for (let i = 1; i <= lines; i++) {
        const div = document.createElement('div');
        div.textContent = i;
        document.getElementById('lineNumbers').appendChild(div);
      }
      
      updateActiveLine();
    }



    window.setLevel = (lvl) => {
      if (currentIndex > 0 && !confirm("Changing level will reset your progress. Continue?")) return;
      currentLevel = lvl;
      document.querySelectorAll('.level-pill').forEach((p, i) => p.classList.toggle('active', i + 1 === lvl));
      resetPractice();
      renderCode();
    };

    function resetPractice() {
      currentIndex = 0;
      mistakes = 0;
      startTime = null;
      isFinished = false;
      document.getElementById('statAccuracy').textContent = "100%";
      document.getElementById('statWPM').textContent = "0";
      document.getElementById('statProgress').textContent = "0%";
      clearTimeout(hintTimer);
    }

    focusOverlay.onclick = () => {
      focusOverlay.classList.add('hidden');
      hiddenInput.focus();
    };

    hiddenInput.onblur = () => {
      if (!isFinished) focusOverlay.classList.remove('hidden');
    };

    hiddenInput.oninput = (e) => {
      if (isFinished) return;
      if (!startTime) startTime = Date.now();

      const char = e.data;
      if (!char) return; // Ignore empty inputs

      // Handle Level 2 & 3 fading
      const refSide = document.getElementById('referenceSide');
      if (currentLevel === 2) {
          refSide.style.opacity = "0.1";
          clearTimeout(hintTimer);
          hintTimer = setTimeout(() => {
              if (!isFinished) refSide.style.opacity = "1";
          }, 2000);
      } else if (currentLevel === 3) {
          refSide.style.opacity = "0"; 
      }

      const cursor = codeDisplay.querySelector('.current');
      const nextNode = cursor.nextSibling;
      const pairs = { '{': '}', '[': ']', '(': ')', '"': '"', "'": "'" };

      // Overtyping auto-closed brackets
      if (nextNode && nextNode.classList && nextNode.classList.contains('auto-closed') && nextNode.textContent === char) {
          nextNode.classList.remove('auto-closed');
          nextNode.classList.add('pending-type');
          // Just move cursor
          codeDisplay.insertBefore(cursor, nextNode.nextSibling || null);
      } else {
          const span = document.createElement('span');
          span.textContent = char;
          span.classList.add('pending-type');
          
          if (char === '\n') {
              validateLineIsolated(true); // isEnter = true
              const br = document.createElement('br');
              codeDisplay.insertBefore(br, cursor);
          } else {
              codeDisplay.insertBefore(span, cursor);
          }
          
          // Smart Auto-Closing
          if (pairs[char]) {
              const extra = document.createElement('span');
              extra.textContent = pairs[char];
              extra.classList.add('pending-type', 'auto-closed');
              codeDisplay.insertBefore(extra, cursor.nextSibling || null);
          }
      }

      updateStats();
      findBracketMatch();
      updateActiveLine();
    };

    hiddenInput.onkeydown = (e) => {
        if (isFinished) return;
        
        if (e.key === 'Tab') {
            e.preventDefault();
            for (let i = 0; i < 4; i++) {
                const event = new InputEvent('input', { data: ' ' });
                hiddenInput.dispatchEvent(event);
            }
            return;
        }

        if (e.key === 'Backspace') {
            const cursor = codeDisplay.querySelector('.current');
            const prev = cursor.previousSibling;
            const next = cursor.nextSibling;
            
            // If deleting an opening bracket that has an auto-closed companion, delete both
            const pairs_map = { '{': '}', '[': ']', '(': ')', '"': '"', "'": "'" };
            
            if (prev && pairs_map[prev.textContent] && next && next.textContent === pairs_map[prev.textContent] && next.classList.contains('auto-closed')) {
                next.remove();
            }

            if (prev) {
                if (prev.nodeName === 'BR') {
                    // Find which line we are removing
                    const allNodes = Array.from(codeDisplay.childNodes);
                    const prevIdx = allNodes.indexOf(prev);
                    const brsBefore = allNodes.slice(0, prevIdx).filter(n => n.nodeName === 'BR').length;
                    
                    // User is merging line (brsBefore + 1) into line (brsBefore)
                    // Only remove from reference if the line being left is empty
                    const targetLines = targetCode.split('\n');
                    const lineBeingLeft = targetLines[brsBefore + 1] || "";
                    
                    if (lineBeingLeft.trim() === "") {
                        removeBlankLineFromReference(brsBefore);
                    }
                    prev.remove();
                } else {
                    prev.remove();
                }
                updateActiveLine();
                e.preventDefault();
            }
            return;
        }

        // Navigation 
        const isUp = e.key === 'ArrowUp';
        const isDown = e.key === 'ArrowDown';
        const isLeft = e.key === 'ArrowLeft';
        const isRight = e.key === 'ArrowRight';

        if (isUp || isDown || isLeft || isRight) {
            e.preventDefault(); // Prevent page scrolling
        }

        const cursor = codeDisplay.querySelector('.current');
        const allNodes = Array.from(codeDisplay.childNodes);
        const cursorIdx = allNodes.indexOf(cursor);

        if (isLeft && cursor.previousSibling) {
            codeDisplay.insertBefore(cursor, cursor.previousSibling);
            updateActiveLine();
            return;
        }
        if (isRight && cursor.nextSibling) {
            codeDisplay.insertBefore(cursor, cursor.nextSibling.nextSibling || null);
            updateActiveLine();
            return;
        }

        if (isUp || isDown) {
            // Validate the current line before leaving it
            validateLineIsolated();

            // Find current column
            let col = 0;
            for (let i = cursorIdx - 1; i >= 0; i--) {
                if (allNodes[i].nodeName === 'BR') break;
                col++;
            }

            // Find target line start
            let targetStartIdx = -1;
            if (isUp) {
                // Find previous BR
                let brCount = 0;
                for (let i = cursorIdx - 1; i >= 0; i--) {
                    if (allNodes[i].nodeName === 'BR') {
                        brCount++;
                        if (brCount === 1) targetStartIdx = i; // End of prev line
                        if (brCount === 2) { targetStartIdx = i + 1; break; } // Start of prev line
                    }
                }
                if (brCount === 1) targetStartIdx = 0; // First line
            } else {
                // Find next BR
                for (let i = cursorIdx + 1; i < allNodes.length; i++) {
                    if (allNodes[i].nodeName === 'BR') {
                        targetStartIdx = i + 1;
                        break;
                    }
                }
            }

            if (targetStartIdx !== -1) {
                // Move to target col or end of target line
                let targetInsertIdx = targetStartIdx;
                let currentTargetCol = 0;
                for (let i = targetStartIdx; i < allNodes.length; i++) {
                    if (currentTargetCol === col || allNodes[i].nodeName === 'BR' || allNodes[i] === cursor) {
                        targetInsertIdx = i;
                        break;
                    }
                    currentTargetCol++;
                    targetInsertIdx = i + 1;
                }
                if (targetInsertIdx > allNodes.length) targetInsertIdx = allNodes.length;
                
                codeDisplay.insertBefore(cursor, allNodes[targetInsertIdx] || null);
                updateActiveLine();
            }
            return;
        }

        if (e.key === 'Enter') {
            e.preventDefault();
            
            const cursor = codeDisplay.querySelector('.current');
            const prevNode = cursor.previousSibling;
            const nextNode = cursor.nextSibling;
            
            // VS Code Style Auto-Indent for {}
            const isBetweenBraces = prevNode && prevNode.textContent === '{' && nextNode && nextNode.textContent === '}';
            
            const event = new InputEvent('input', { data: '\n' });
            hiddenInput.dispatchEvent(event);

            // Calculate current indentation
            const allNodes = Array.from(codeDisplay.childNodes);
            const currentIdx = allNodes.indexOf(cursor) || allNodes.length;
            let indent = '';
            for (let i = currentIdx - 2; i >= 0; i--) {
                const node = allNodes[i];
                if (!node || node.nodeName === 'BR' || node.textContent === '\n') break;
                if (node.textContent === ' ' || node.textContent === '\t') indent += node.textContent;
                else indent = ''; 
            }

            if (isBetweenBraces) {
                // Add extra indent
                const extraIndent = '    ';
                for (let i = 0; i < (indent + extraIndent).length; i++) {
                    hiddenInput.dispatchEvent(new InputEvent('input', { data: ' ' }));
                }
                
                // Add another newline and indent for the closing brace
                const br = document.createElement('br');
                codeDisplay.insertBefore(br, nextNode);
                for (let i = 0; i < indent.length; i++) {
                    const sp = document.createElement('span');
                    sp.textContent = ' ';
                    sp.classList.add('pending-type');
                    codeDisplay.insertBefore(sp, nextNode);
                }
            } else {
                // Normal auto-indent
                if (indent.length > 0) {
                    for (let i = 0; i < indent.length; i++) {
                        const spEvent = new InputEvent('input', { data: indent[i] });
                        hiddenInput.dispatchEvent(spEvent);
                    }
                }
            }
        }
    };

    // Synchronize scrolling
    const typingSide = document.getElementById('typingSide');
    const referenceSide = document.getElementById('referenceSide');

    codeDisplay.onscroll = () => {
        if (true) {
            referenceSide.scrollTop = codeDisplay.scrollTop;
        }
    };
    referenceSide.onscroll = () => {
        if (true) {
            codeDisplay.scrollTop = referenceSide.scrollTop;
        }
    };

    function updateActiveLine() {
        const currentSpan = codeDisplay.querySelector('.current');
        if (!currentSpan) return;
        
        const lineY = currentSpan.offsetTop;
        document.getElementById('activeLine').style.top = `${lineY}px`;
        updateLineNumbers();
    }

    function updateLineNumbers() {
        const lineNumbers = document.getElementById('lineNumbers');
        if (!lineNumbers) return;
        
        // Count actual line breaks in the typing area
        const brCount = codeDisplay.querySelectorAll('br').length;
        // Total lines is brCount + 1 (for the current line)
        const totalLines = Math.max(targetCode.split('\n').length, brCount + 1);
        
        const currentLineCount = lineNumbers.children.length;
        if (totalLines > currentLineCount) {
            for (let i = currentLineCount + 1; i <= totalLines; i++) {
                const div = document.createElement('div');
                div.textContent = i;
                lineNumbers.appendChild(div);
            }
        } else if (totalLines < currentLineCount) {
            while (lineNumbers.children.length > totalLines) {
                lineNumbers.lastElementChild.remove();
            }
        }
    }

    function findBracketMatch() {
        const spans = Array.from(codeDisplay.querySelectorAll('span'));
        spans.forEach(s => s.classList.remove('bracket-match'));
        
        const cursor = codeDisplay.querySelector('.current');
        if (!cursor) return;

        // Check character before and after cursor
        const prev = cursor.previousSibling;
        const next = cursor.nextSibling;
        
        const pairs = { '{': '}', '[': ']', '(': ')', '}': '{', ']': '[', ')': '(' };
        let targetNode = null;
        let char = '';

        if (next && pairs[next.textContent]) {
            targetNode = next;
            char = next.textContent;
        } else if (prev && pairs[prev.textContent]) {
            targetNode = prev;
            char = prev.textContent;
        }

        if (!targetNode || !pairs[char]) return;

        const isOpening = ['{', '[', '('].includes(char);
        const closingChar = pairs[char];
        let depth = 0;
        let matchNode = null;

        const nodes = Array.from(codeDisplay.childNodes).filter(n => n.nodeType === 1 && n.tagName === 'SPAN');
        const startIdx = nodes.indexOf(targetNode);

        if (isOpening) {
            for (let i = startIdx; i < nodes.length; i++) {
                if (nodes[i].textContent === char) depth++;
                if (nodes[i].textContent === closingChar) depth--;
                if (depth === 0) {
                    matchNode = nodes[i];
                    break;
                }
            }
        } else {
            for (let i = startIdx; i >= 0; i--) {
                if (nodes[i].textContent === char) depth++;
                if (nodes[i].textContent === closingChar) depth--;
                if (depth === 0) {
                    matchNode = nodes[i];
                    break;
                }
            }
        }

        if (matchNode) {
            targetNode.classList.add('bracket-match');
            matchNode.classList.add('bracket-match');
        }
    }


    function updateStats() {
      let typedChars, incorrectChars, accuracy, progress, wpmChars;

      if (true) {
        // Level 1: derive stats from DOM (currentIndex is unused in this mode)
        // Only count VALIDATED spans (.correct or .incorrect), not pending mid-line chars
        const validatedSpans = Array.from(codeDisplay.querySelectorAll(
          'span.correct, span.incorrect'
        )).filter(s => !s.classList.contains('auto-closed'));

        const correctCount   = validatedSpans.filter(s => s.classList.contains('correct')).length;
        const incorrectCount = validatedSpans.filter(s => s.classList.contains('incorrect')).length;
        const validatedTotal = validatedSpans.length;

        // Accuracy is based only on validated chars (updated per-line on Enter)
        accuracy = validatedTotal === 0 ? 100 : Math.max(0, Math.floor((correctCount / validatedTotal) * 100));

        // Progress: all typed spans (including pending) vs total target length
        const allTyped = Array.from(codeDisplay.querySelectorAll(
          'span:not(.current):not(.auto-closed)'
        ));
        typedChars = allTyped.length;
        progress   = Math.min(100, Math.floor((typedChars / Math.max(1, targetCode.length)) * 100));
        wpmChars   = typedChars;
      } else {
        // Level 2 & 3: use currentIndex
        typedChars   = currentIndex;
        accuracy     = Math.max(0, Math.floor(((currentIndex - mistakes) / Math.max(1, currentIndex)) * 100));
        progress     = Math.floor((currentIndex / targetCode.length) * 100);
        wpmChars     = currentIndex;
      }

      document.getElementById('statAccuracy').textContent = accuracy + "%";
      document.getElementById('statProgress').textContent = progress + "%";
      document.getElementById('topProgress').style.width = progress + "%";

      if (startTime) {
        const timeElapsed = (Date.now() - startTime) / 1000 / 60;
        const wpm = Math.floor((wpmChars / 5) / Math.max(0.01, timeElapsed));
        document.getElementById('statWPM').textContent = wpm;
      }
    }

    window.nextLevel = () => {
        document.getElementById('congratsModal').classList.remove('active');
        currentIndex = 0; // bypass confirm
        window.setLevel(currentLevel + 1);
        hiddenInput.focus();
    };

    window.retryLevel = () => {
        document.getElementById('congratsModal').classList.remove('active');
        currentIndex = 0; // bypass confirm
        window.setLevel(currentLevel);
        hiddenInput.focus();
    };

    function finishPractice() {
      isFinished = true;
      
      // Get the final displayed accuracy and WPM values from the DOM
      const finalAccuracy = parseInt(document.getElementById('statAccuracy').textContent) || 0;
      const finalWpm = parseInt(document.getElementById('statWPM').textContent) || 0;
      
      const modalContent = document.querySelector('#congratsModal .modal-content');
      let title = "";
      let message = "";
      let buttonsHtml = "";

      if (finalAccuracy === 100 && finalWpm >= 15) {
          if (currentLevel < 3) {
              title = "Level Clear!";
              message = `Excellent! You completed the practice with ${finalAccuracy}% accuracy and ${finalWpm} WPM. Ready for the next level?`;
              buttonsHtml = `
                  <button class="action-btn" onclick="window.nextLevel()">Next Level</button>
                  <button class="action-btn" style="background: var(--glass-bg); border: 1px solid var(--glass-border); margin-left: 10px;" onclick="window.location.href='resources.html'">Finish</button>
              `;
          } else {
              title = "Mastery Achieved!";
              message = `You have completely mastered this code snippet with ${finalAccuracy}% accuracy and ${finalWpm} WPM on Blind Mode!`;
              buttonsHtml = `
                  <button class="action-btn" onclick="window.location.href='resources.html'">Finish</button>
              `;
          }
      } else {
          title = "Keep Practicing!";
          message = `You got ${finalAccuracy}% accuracy and ${finalWpm} WPM. You need 100% accuracy and at least 15 WPM to advance to the next level.`;
          buttonsHtml = `
              <button class="action-btn" onclick="window.retryLevel()">Retry Level</button>
              <button class="action-btn" style="background: var(--glass-bg); border: 1px solid var(--glass-border); margin-left: 10px;" onclick="window.location.href='resources.html'">Finish</button>
          `;
      }

      modalContent.innerHTML = `
          <h2>${title}</h2>
          <p id="finalStats" style="margin-bottom: 20px;">${message}</p>
          ${buttonsHtml}
      `;
      
      document.getElementById('congratsModal').classList.add('active');
    }

    /**
     * Insert a blank line into the reference display after the Nth line.
     * referenceDisplay uses white-space:pre-wrap with \n in text nodes (from hljs).
     */
    function insertBlankLineInReference(afterLineIndex) {
        // Sync targetCode with the inserted blank line so validation stays aligned!
        const linesArr = targetCode.split('\n');
        linesArr.splice(afterLineIndex + 1, 0, "");
        targetCode = linesArr.join('\n');

        const refDisplay = document.getElementById('referenceDisplay');
        if (!refDisplay) return;

        // Handle insertion at the very beginning (before line 0)
        if (afterLineIndex === -1) {
            refDisplay.insertBefore(document.createTextNode('\n'), refDisplay.firstChild);
        } else {
            // Walk all text nodes, counting \n characters until we reach afterLineIndex
            const walker = document.createTreeWalker(refDisplay, NodeFilter.SHOW_TEXT, null);
            let linesSeen = 0;
            let targetTextNode = null;
            let insertOffset = 0;

            let node;
            while ((node = walker.nextNode())) {
                const text = node.textContent;
                for (let i = 0; i < text.length; i++) {
                    if (text[i] === '\n') {
                        linesSeen++;
                        if (linesSeen === afterLineIndex + 1) {
                            // Insert a blank line right after this \n
                            targetTextNode = node;
                            insertOffset = i + 1;
                            break;
                        }
                    }
                }
                if (targetTextNode) break;
            }

            if (targetTextNode) {
                // Split the text node at insertOffset and insert \n between the two parts
                const after = targetTextNode.splitText(insertOffset);
                targetTextNode.parentNode.insertBefore(document.createTextNode('\n'), after);
            } else {
                // Append at the end (cursor is at the last line)
                refDisplay.appendChild(document.createTextNode('\n'));
            }
        }

        // Also add a line number entry
        const lineNumbers = document.getElementById('lineNumbers');
        if (lineNumbers) {
            const div = document.createElement('div');
            div.textContent = lineNumbers.children.length + 1;
            lineNumbers.appendChild(div);
        }
    }

    function removeBlankLineFromReference(lineIndex) {
        const linesArr = targetCode.split('\n');
        if (linesArr.length <= 1) return;
        
        // Remove the line from targetCode to keep validation in sync
        linesArr.splice(lineIndex, 1);
        targetCode = linesArr.join('\n');

        const refDisplay = document.getElementById('referenceDisplay');
        if (!refDisplay) return;

        // Walk all text nodes, counting \n characters to find the one to remove
        const walker = document.createTreeWalker(refDisplay, NodeFilter.SHOW_TEXT, null);
        let linesSeen = 0;
        let node;
        while ((node = walker.nextNode())) {
            const text = node.textContent;
            for (let i = 0; i < text.length; i++) {
                if (text[i] === '\n') {
                    if (linesSeen === lineIndex) {
                        // Remove this specific newline character
                        node.textContent = text.substring(0, i) + text.substring(i + 1);
                        
                        // Update line numbers display
                        const lineNumbers = document.getElementById('lineNumbers');
                        if (lineNumbers && lineNumbers.lastElementChild) {
                            lineNumbers.lastElementChild.remove();
                        }
                        return;
                    }
                    linesSeen++;
                }
            }
        }
    }

    function validateLineIsolated(isEnter = false) {
        const allNodes = Array.from(codeDisplay.childNodes);
        const cursor = codeDisplay.querySelector('.current');
        if (!cursor) return;
        const cursorIdx = allNodes.indexOf(cursor);
        
        let startIdx = 0;
        for (let i = cursorIdx - 1; i >= 0; i--) {
            if (allNodes[i].nodeName === 'BR') {
                startIdx = i + 1;
                break;
            }
        }

        let endIdx = allNodes.length - 1;
        if (isEnter) {
            // When pressing Enter, only validate what is BEFORE the cursor on this line.
            // This prevents auto-closed brackets (which are after the cursor) from being counted.
            endIdx = cursorIdx - 1;
        } else {
            for (let i = cursorIdx; i < allNodes.length; i++) {
                if (allNodes[i].nodeName === 'BR') {
                    endIdx = i - 1;
                    break;
                }
            }
        }

        let nodesInLine = [];
        for (let i = startIdx; i <= endIdx; i++) {
            if (allNodes[i] !== cursor && allNodes[i].nodeName !== 'BR') {
                nodesInLine.push(allNodes[i]);
            }
        }

        const targetLines = targetCode.split('\n');
        const brsBefore = allNodes.slice(0, startIdx).filter(n => n.nodeName === 'BR').length;

        // If the line is empty (user just pressed Enter for a blank line), allow it freely
        if (nodesInLine.length === 0) {
            if (isEnter) {
                // If the current expected line in reference was already empty, 
                // it means the user just "matched" it. No shift needed.
                const expectedLine = targetLines[brsBefore] || "";
                if (expectedLine.trim() !== "") {
                    insertBlankLineInReference(brsBefore - 1);
                }
            }
            updateStats();
            return;
        }

        const typedText = nodesInLine.map(n => n.textContent).join("");
        const expectedLine = targetLines[brsBefore] || "";

        // Compare and color
        const normalize = s => s
            .trim()
            .replace(/\s*([^\w\s])\s*/g, '$1')
            .replace(/\s+/g, ' ');
        
        if (normalize(typedText) === normalize(expectedLine)) {
            nodesInLine.forEach(n => {
                if (n.nodeType === 1) {
                    n.classList.remove('pending-type', 'incorrect');
                    n.classList.add('correct');
                }
            });
        } else {
            nodesInLine.forEach(n => {
                if (n.nodeType === 1) {
                    n.classList.remove('pending-type', 'correct');
                    n.classList.add('incorrect');
                }
            });
            mistakes++;
            // Shake
            const container = document.getElementById('editorContainer');
            container.classList.remove('shake');
            void container.offsetWidth; 
            container.classList.add('shake');
        }
        updateStats();

        // Check completion
        if (!isFinished) {
            const targetLinesCount = targetLines.length;
            const brsTotal = allNodes.filter(n => n.nodeName === 'BR').length;
            const hasIncorrect = codeDisplay.querySelector('span.incorrect') !== null;
            const hasPending   = codeDisplay.querySelectorAll('span.pending-type:not(.auto-closed)').length > 0;

            if (brsTotal >= targetLinesCount - 1 && !hasIncorrect && !hasPending) {
                finishPractice();
            }
        }
    }
