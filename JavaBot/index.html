<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaBot – Adaptive Java OOP Trainer</title>
  <meta name="description"
    content="AI-powered adaptive Java OOP trainer that tracks your knowledge and adjusts difficulty in real time." />
  <!-- CodeMirror -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ── HEADER ── -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />
            <path d="M2 17l10 5 10-5" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />
            <path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />
          </svg>
        </div>
        <span>JavaBot</span>
      </div>

      <div class="header-meta">
        <span class="chip" id="chip-topic">Loading…</span>
        <span class="chip chip-level" id="chip-level">Beginner</span>
        <div class="progress-track">
          <div class="progress-fill-track" id="global-progress"></div>
        </div>
        <span class="chip chip-score" id="chip-score">Score: 0</span>
        <span class="chip chip-count" id="chip-count">Q: 0</span>
      </div>
    </div>
  </header>

  <!-- ── MAIN ── -->
  <main class="main-wrapper">

    <!-- LEFT: Question Panel -->
    <section class="left-col">

      <!-- Question Card -->
      <div class="question-panel" id="question-panel">

        <!-- Question loading state -->
        <div class="q-generating" id="q-generating">
          <div class="loading-dots"><span></span><span></span><span></span></div>
          <p class="loading-text" id="q-gen-msg">Generating your question…</p>
        </div>

        <!-- Actual question content -->
        <div id="q-content" style="display:none;">
          <div class="q-badge">
            <span class="difficulty-tag" id="difficulty-tag">Beginner</span>
            <span class="concept-tag" id="concept-tag">Topic</span>
          </div>
          <h1 class="q-title" id="q-title">Question</h1>
          <div class="q-body" id="q-body"></div>

          <div class="hint-box" id="hint-box" style="display:none;">
            <div class="hint-icon">💡</div>
            <div class="hint-text" id="hint-text"></div>
          </div>
          <button class="btn-hint" id="btn-hint">💡 Show Hint</button>
        </div>
      </div>

      <!-- Knowledge Profile -->
      <div class="knowledge-panel" id="knowledge-panel">
        <div class="kp-header">
          <span class="kp-title">Knowledge Profile</span>
          <button class="kp-toggle" id="kp-toggle">▾</button>
        </div>
        <div class="kp-body" id="kp-body">
          <!-- Topic rows injected by JS -->
        </div>
      </div>

    </section>

    <!-- RIGHT: Code + Feedback -->
    <section class="code-panel">

      <!-- Editor -->
      <div class="editor-wrapper" id="editor-wrapper">
        <div class="editor-topbar">
          <div class="editor-dots"><span></span><span></span><span></span></div>
          <span class="editor-filename">Solution.java</span>
          <div class="editor-actions">
            <button class="btn-icon-sm" id="btn-clear" title="Clear">🗑</button>
            <button class="btn-icon-sm" id="btn-copy" title="Copy">📋</button>
          </div>
        </div>
        <div class="editor-body">
          <div id="code-editor-container"></div>
        </div>
      </div>

      <!-- Actions -->
      <div class="action-row">
        <button class="btn btn-submit" id="btn-submit" disabled>
          Submit Code
        </button>
        <button class="btn btn-skip" id="btn-skip" disabled>
          ⏭ Skip
        </button>
        <button class="btn btn-next" id="btn-next" style="display:none;">
          Next Question →
        </button>
      </div>

      <!-- AI Feedback -->
      <div class="feedback-panel" id="feedback-panel" style="display:none;">
        <div class="feedback-header">
          <div class="ai-avatar">🤖</div>
          <div>
            <div class="feedback-title">AI Feedback</div>
            <div class="feedback-subtitle" id="feedback-verdict"></div>
          </div>
          <div class="score-badge" id="score-badge"></div>
        </div>
        <div class="feedback-divider"></div>
        <div class="feedback-body" id="feedback-body"></div>
      </div>

      <!-- Loading feedback -->
      <div class="loading-panel" id="loading-panel" style="display:none;">
        <div class="loading-dots"><span></span><span></span><span></span></div>
        <p class="loading-text">AI is reviewing your code…</p>
      </div>

    </section>
  </main>

  <!-- CodeMirror JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/anyword-hint.min.js"></script>
  <script type="module" src="app.js"></script>
</body>

</html>
