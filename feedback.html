<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback | CodeBase</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent-primary: #4f46e5;
      --accent-secondary: #818cf8;
      --accent-success: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body {
      margin: 0; font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      background-image: radial-gradient(circle at 0% 0%, rgba(79, 70, 229, 0.15) 0%, transparent 50%), radial-gradient(circle at 100% 100%, rgba(129, 140, 248, 0.1) 0%, transparent 50%);
      color: var(--text-main); min-height: 100vh; display: flex;
    }

    /* Sidebar Styling */
    .sidebar { width: 300px; height: 100vh; position: sticky; top: 0; background: var(--glass-bg); backdrop-filter: blur(20px); border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; padding: 40px 24px; z-index: 100; overflow-y: auto; }
    .sidebar::-webkit-scrollbar { display: none; }
    .sidebar { -ms-overflow-style: none; scrollbar-width: none; }

    .profile-avatar-wrap { position: relative; width: 120px; height: 120px; margin: 0 auto 20px; padding: 4px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); }
    .profile-avatar-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--bg-dark); }
    .profile-info { text-align: center; }
    .profile-info h2 { font-family: 'Poppins', sans-serif; font-size: 1.25rem; font-weight: 700; margin: 0 0 4px; }
    .profile-info p { font-size: 0.875rem; color: var(--text-muted); margin: 0; }

    .nav-links { flex: 1; display: flex; flex-direction: column; gap: 8px; margin-top: 30px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: var(--text-muted); text-decoration: none; font-weight: 500; transition: all 0.2s ease; cursor: pointer; }
    .nav-item:hover, .nav-item.active { background: rgba(255, 255, 255, 0.05); color: var(--text-main); }
    .nav-item.active { background: var(--accent-primary); box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3); }

    .main-content { flex: 1; height: 100vh; overflow-y: auto; padding: 40px 60px; display: flex; flex-direction: column; gap: 32px; }
    header.main-header h1 { font-family: 'Poppins', sans-serif; font-size: 2rem; font-weight: 700; margin: 0; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

    /* Form Styling */
    .form-container { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px; padding: 40px; max-width: 600px; backdrop-filter: blur(10px); }
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-main); font-family: inherit; font-size: 1rem; transition: all 0.2s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent-primary); background: rgba(255, 255, 255, 0.08); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
    
    .submit-btn { width: 100%; padding: 14px; background: var(--accent-primary); color: white; border: none; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .submit-btn:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Mobile adjustments */
    @media (max-width: 1024px) {
      .sidebar { display: none; } /* hide sidebar on mobile for simplicity */
      .main-content { padding: 40px 20px; }
      body { flex-direction: column; }
    }

    .breadcrumbs { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
    .breadcrumbs a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    .breadcrumbs a:hover { color: var(--accent-primary); }

    .loading-spinner { width: 20px; height: 20px; border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .logout-btn-wrap { margin-top: auto; padding-top: 20px; }
    .logout-btn { width: 100%; padding: 12px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 12px; color: #ef4444; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .logout-btn:hover { background: #ef4444; color: white; }
  </style>
</head>

<body>
  <aside class="sidebar">
    <div class="profile-section">
      <div class="profile-avatar-wrap">
        <img id="userPhoto" src="https://ui-avatars.com/api/?name=User&background=4f46e5&color=fff" alt="Avatar">
      </div>
      <div class="profile-info">
        <h2 id="userName">Loading...</h2>
        <p id="userEmail">...</p>
      </div>
    </div>

    <nav class="nav-links">
      <a href="dashboard.html" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>
        </svg> Dashboard
      </a>
      <a href="feedback.html" class="nav-item active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg> Feedback
      </a>
      <a href="about.html" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg> About Us
      </a>
    </nav>
    <div class="logout-btn-wrap">
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="main-header">
      <div class="breadcrumbs">
        <a href="dashboard.html">Home</a> &gt; <span>Feedback</span>
      </div>
      <h1>Submit Feedback</h1>
    </header>

    <div class="form-container">
      <p style="color: var(--text-muted); margin-bottom: 24px;">We'd love to hear your thoughts, suggestions, or any issues you've encountered. Your feedback helps us improve CodeBase!</p>
      
      <form id="feedbackForm">
        <div class="form-group">
          <label for="feedbackType">Feedback Type</label>
          <select id="feedbackType" required>
            <option value="" disabled selected>Select an option</option>
            <option value="General Feedback">General Feedback</option>
            <option value="Feature Request">Feature Request</option>
            <option value="Bug Report">Bug Report</option>
            <option value="Course Content Issue">Course Content Issue</option>
          </select>
        </div>

        <div class="form-group">
          <label for="feedbackRating">Rate Your Experience (1-5)</label>
          <select id="feedbackRating" required>
            <option value="5">⭐⭐⭐⭐⭐ (5) - Excellent</option>
            <option value="4">⭐⭐⭐⭐ (4) - Good</option>
            <option value="3">⭐⭐⭐ (3) - Average</option>
            <option value="2">⭐⭐ (2) - Poor</option>
            <option value="1">⭐ (1) - Terrible</option>
          </select>
        </div>

        <div class="form-group">
          <label for="feedbackMessage">Message</label>
          <textarea id="feedbackMessage" rows="5" placeholder="Please provide details here..." required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span>Submit Feedback</span>
          <div class="loading-spinner" id="submitSpinner"></div>
        </button>
      </form>
    </div>
  </main>

  <script type="module">
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
    import { app } from "./assets/js/firebase.js";

    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
      
      const userDoc = await getDoc(doc(db, "users", user.uid));
      let userName = user.displayName;
      if (userDoc.exists() && userDoc.data().name) {
          userName = userDoc.data().name;
      }

      document.getElementById('userName').textContent = userName || "Student";
      document.getElementById('userEmail').textContent = user.email;
      if (user.photoURL) {
        document.getElementById('userPhoto').src = user.photoURL;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await signOut(auth);
        localStorage.clear();
        window.location.href = "login.html";
    });

    document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const type = document.getElementById('feedbackType').value;
      const rating = document.getElementById('feedbackRating').value;
      const message = document.getElementById('feedbackMessage').value;
      
      const submitBtn = document.getElementById('submitBtn');
      const spinner = document.getElementById('submitSpinner');
      
      submitBtn.disabled = true;
      spinner.style.display = 'block';

      try {
        await addDoc(collection(db, "feedback"), {
          userId: currentUser.uid,
          userEmail: currentUser.email,
          userName: document.getElementById('userName').textContent,
          type: type,
          rating: parseInt(rating),
          message: message,
          timestamp: serverTimestamp()
        });
        
        alert("Thank you! Your feedback has been submitted successfully.");
        document.getElementById('feedbackForm').reset();
      } catch (error) {
        console.error("Error submitting feedback: ", error);
        alert("An error occurred while submitting. Please try again.");
      } finally {
        submitBtn.disabled = false;
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
