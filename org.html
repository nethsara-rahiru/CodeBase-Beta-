<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization Details | CodeBase</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #4f46e5;
            --accent-secondary: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(79, 70, 229, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(129, 140, 248, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            overflow: visible; /* Allow logo to overflow */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.98) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .hero {
            height: 240px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 40px;
            overflow: hidden;
            transition: background 0.5s ease, background-image 0.5s ease;
            border-top-left-radius: 31px; /* Match container */
            border-top-right-radius: 31px;
        }

        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: translateX(-100%);
            animation: shimmer 4s infinite linear;
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        .org-logo-wrap {
            width: 140px;
            height: 140px;
            background: #ffffff;
            border-radius: 28px;
            position: absolute;
            top: 170px; /* Positioned relative to container top */
            left: 40px;
            padding: 12px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border: 4px solid #1e293b;
        }

        .org-logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }

        .content {
            padding: 100px 40px 60px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .org-category {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 8px;
        }

        .org-name {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--text-main);
            line-height: 1.1;
        }

        .org-description {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-muted);
            margin: 24px 0 32px;
            font-weight: 400;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(to right, var(--accent-primary), #818cf8);
            color: white;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .social-links {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
        }

        .social-icon {
            width: 44px;
            height: 44px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.3s;
        }

        .social-icon:hover {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            transform: translateY(-3px);
            color: white;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            padding-top: 32px;
            border-top: 1px solid var(--glass-border);
        }

        .info-item h5 {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .info-item p {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .edit-fab {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 64px;
            height: 64px;
            background: var(--accent-primary);
            color: white;
            border-radius: 20px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.4);
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .edit-fab:hover {
            transform: scale(1.1) rotate(5deg);
        }

        /* Inline Edit Styles */
        .edit-input, .edit-textarea, .edit-select {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--accent-primary);
            border-radius: 8px;
            color: white;
            padding: 8px 12px;
            font-family: inherit;
            display: none;
        }

        .edit-input-name {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 12px;
        }

        .edit-textarea-desc {
            font-size: 1.05rem;
            line-height: 1.7;
            min-height: 150px;
            margin: 24px 0;
            resize: vertical;
        }

        body.edit-mode-active .view-element { display: none; }
        body.edit-mode-active .edit-element,
        body.edit-mode-active .edit-input,
        body.edit-mode-active .edit-textarea,
        body.edit-mode-active .edit-select { display: block; }

        .edit-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 16px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        body.edit-mode-active .edit-controls { display: flex; }

        .logo-edit-btn {
            position: absolute;
            bottom: -10px;
            right: -10px;
            width: 40px;
            height: 40px;
            background: var(--accent-primary);
            border-radius: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 3px solid #1e293b;
            color: white;
            transition: all 0.2s;
        }

        body.edit-mode-active .logo-edit-btn { display: flex; }

        .color-picker-wrap {
            position: absolute;
            top: 20px;
            right: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        body.edit-mode-active .color-picker-wrap { display: flex; }

        .cover-edit-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .cover-edit-btn:hover {
            background: var(--accent-primary);
        }

        body.edit-mode-active .cover-edit-btn { display: flex; }

        .back-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            z-index: 100;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: var(--accent-primary);
            transform: translateX(-5px);
        }

        @media (max-width: 640px) {
            .org-name { font-size: 2rem; }
            .content { padding: 80px 24px 40px; }
            .org-logo-wrap { width: 110px; height: 110px; left: 24px; top: 185px; }
            .btn { width: 100%; }
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.875rem; font-weight: 600; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border); border-radius: 12px; color: white;
        }
        select option {
            background: #1e293b;
            color: white;
        }
    </style>
</head>

<body>

    <a href="dashboard.html" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Dashboard
    </a>

    <div class="container" id="mainContainer">
        <div class="hero" id="orgHero">
            <div class="color-picker-wrap">
                <span style="font-size:0.7rem; font-weight:700; text-transform:uppercase; color:white;">Theme Color</span>
                <input type="color" id="editColor" style="width:30px; height:30px; border:none; background:none; cursor:pointer;">
            </div>
            <label for="editCoverInput" class="cover-edit-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                Change Cover Photo
            </label>
            <input type="file" id="editCoverInput" accept="image/*" style="display:none;">
        </div>
        <div class="org-logo-wrap">
            <img id="orgLogo" src="" alt="Org Logo">
            <label for="editLogoInput" class="logo-edit-btn" title="Change Logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            </label>
            <input type="file" id="editLogoInput" accept="image/*" style="display:none;">
        </div>
        <div class="content">
            <div id="mainLoading" style="position: absolute; inset: 0; background: #0f172a; z-index: 50; display: flex; align-items: center; justify-content: center; border-radius: 32px; transition: opacity 0.4s ease;">
                <div style="width: 32px; height: 32px; border: 3px solid rgba(79, 70, 229, 0.1); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            </div>

            <div class="header-row">
                <div style="flex: 1;">
                    <p class="org-category view-element" id="orgCategory">Loading...</p>
                    <select id="editCategory" class="edit-select edit-element" style="margin-bottom: 8px;">
                        <option value="Faculty">Faculty</option>
                        <option value="University">University</option>
                        <option value="National">National</option>
                        <option value="International">International</option>
                        <option value="Sports">Sports</option>
                        <option value="Religious">Religious</option>
                        <option value="Other">Other</option>
                    </select>

                    <h1 class="org-name view-element" id="orgName">---</h1>
                    <input type="text" id="editName" class="edit-input edit-input-name edit-element" placeholder="Organization Name">
                </div>
                <div class="action-bar view-element">
                    <button class="btn btn-primary" id="joinBtn">Join Now</button>
                </div>
            </div>
            
            <p class="org-description view-element" id="orgDesc">Loading organization details...</p>
            <textarea id="editDescription" class="edit-textarea edit-textarea-desc edit-element" placeholder="Describe your organization..."></textarea>

            <div class="social-links view-element" id="socialLinks"></div>
            
            <div class="edit-element" style="margin-bottom: 32px;">
                <h5 style="font-size:0.65rem; text-transform:uppercase; color:var(--text-muted); letter-spacing:0.15em; margin-bottom:12px; font-weight:800;">Social & External Links</h5>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group"><label>Facebook</label><input type="url" id="editFb" class="edit-input" placeholder="Facebook URL"></div>
                    <div class="form-group"><label>YouTube</label><input type="url" id="editYt" class="edit-input" placeholder="YouTube URL"></div>
                    <div class="form-group">
                        <label>External Join Link (Google Form/WhatsApp)</label>
                        <input type="url" id="editJoinLink" class="edit-input" placeholder="https://...">
                        <button type="button" class="btn btn-outline" style="margin-top: 8px; font-size: 0.7rem; padding: 6px 12px; width: fit-content;" onclick="document.getElementById('editJoinLink').value = ''">Close Registration</button>
                    </div>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <h5>Website</h5>
                    <p id="orgWebsite" class="view-element">---</p>
                    <input type="url" id="editWebsite" class="edit-input edit-element" placeholder="Website URL">
                </div>
                <div class="info-item">
                    <h5>Contact Email</h5>
                    <p id="orgEmail" class="view-element">---</p>
                    <input type="email" id="editContactEmail" class="edit-input edit-element" placeholder="Email Address">
                </div>
            </div>
        </div>
    </div>

    <div class="edit-controls" id="editControls">
        <button class="btn btn-primary" id="saveBtn" onclick="saveChanges()">Save Changes</button>
        <button class="btn btn-outline" onclick="toggleEditMode(false)">Cancel</button>
    </div>

    <div class="edit-fab" id="editBtn" onclick="toggleEditMode(true)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4L18.5 2.5z"></path>
        </svg>
    </div>

    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
        import { app } from "./assets/js/firebase.js";

        const db = getFirestore(app);
        const auth = getAuth(app);
        const urlParams = new URLSearchParams(window.location.search);
        const orgId = urlParams.get("id");

        const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dbnvewztc/image/upload";
        const UPLOAD_PRESET = "CodeBase";

        if (!orgId) window.location.href = "dashboard.html";

        let currentOrgData = null;

        // Pic Preview Handlers
        document.getElementById("editLogoInput").onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (re) => { document.getElementById("orgLogo").src = re.target.result; };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById("editCoverInput").onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (re) => { 
                    document.getElementById("orgHero").style.backgroundImage = `linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.4)), url('${re.target.result}')`; 
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById("editColor").oninput = (e) => {
            const color = e.target.value;
            const hero = document.getElementById("orgHero");
            if (!document.getElementById("editCoverInput").files[0] && !currentOrgData.coverUrl) {
                hero.style.background = `linear-gradient(135deg, ${color}, var(--accent-secondary))`;
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }

            const userSnap = await getDoc(doc(db, "users", user.uid));
            const userData = userSnap.data();

            await loadOrgDetails();
            checkPermissions(userData);
        });

        async function loadOrgDetails() {
            const snap = await getDoc(doc(db, "organizations", orgId));
            if (!snap.exists()) { window.location.href = "dashboard.html"; return; }

            const data = snap.data();
            currentOrgData = data;

            document.getElementById("orgName").textContent = data.name;
            document.getElementById("orgDesc").textContent = data.description || "No description available.";
            document.getElementById("orgCategory").textContent = data.category || "University Organization";
            document.getElementById("orgLogo").src = data.icon || "";
            
            if (data.coverUrl) {
                document.getElementById("orgHero").style.backgroundImage = `linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.4)), url('${data.coverUrl}')`;
            } else {
                document.getElementById("orgHero").style.background = `linear-gradient(135deg, ${data.color || '#4f46e5'}, var(--accent-secondary))`;
            }

            document.getElementById("editName").value = data.name;
            document.getElementById("editDescription").value = data.description || "";
            document.getElementById("editCategory").value = data.category || "University";
            document.getElementById("editColor").value = data.color || "#4f46e5";
            document.getElementById("editFb").value = data.fb || "";
            document.getElementById("editYt").value = data.yt || "";
            document.getElementById("editWebsite").value = data.website || "";
            document.getElementById("editContactEmail").value = data.contactEmail || "";
            document.getElementById("editJoinLink").value = data.joinLink || "";

            // Dynamic Social Icons
            const socialHost = document.getElementById("socialLinks");
            socialHost.innerHTML = "";
            if (data.fb) socialHost.innerHTML += `<a href="${data.fb}" target="_blank" class="social-icon" title="Facebook"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg></a>`;
            if (data.yt) socialHost.innerHTML += `<a href="${data.yt}" target="_blank" class="social-icon" title="YouTube"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-1.94C18.88 4 12 4 12 4s-6.88 0-8.6.48a2.78 2.78 0 0 0-1.94 1.94C1 8.14 1 12 1 12s0 3.86.48 5.58a2.78 2.78 0 0 0 1.94 1.94c1.72.48 8.6.48 8.6.48s6.88 0 8.6-.48a2.78 2.78 0 0 0 1.94-1.94C23 15.86 23 12 23 12s0-3.86-.48-5.58z"></path><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"></polygon></svg></a>`;
            if (data.website) socialHost.innerHTML += `<a href="${data.website}" target="_blank" class="social-icon" title="Website"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></a>`;

            document.getElementById("orgWebsite").innerHTML = data.website ? `<a href="${data.website}" target="_blank" style="color:var(--accent-primary); text-decoration:none;">${data.website.replace(/^https?:\/\//, '')}</a>` : "N/A";
            document.getElementById("orgEmail").textContent = data.contactEmail || "N/A";

            // Update Join Btn
            const joinBtn = document.getElementById("joinBtn");
            if (data.joinLink && data.joinLink.trim() !== "") {
                joinBtn.textContent = "Join Now";
                joinBtn.disabled = false;
                joinBtn.style.opacity = "1";
                joinBtn.onclick = () => window.open(data.joinLink, "_blank");
            } else {
                joinBtn.textContent = "Registration Closed";
                joinBtn.disabled = true;
                joinBtn.style.opacity = "0.5";
                joinBtn.style.cursor = "not-allowed";
                joinBtn.onclick = null;
            }

            // Final polished exit for loading
            const loader = document.getElementById("mainLoading");
            loader.style.opacity = "0";
            setTimeout(() => loader.style.display = "none", 400);
        }

        async function checkPermissions(userData) {
            if (userData.role === "owner") {
                document.getElementById("editBtn").style.display = "flex";
                return;
            }

            if (["admin", "editor"].includes(userData.role)) {
                const roleSnap = await getDoc(doc(db, "roles", userData.customRoleId || "none"));
                if (roleSnap.exists()) {
                    const perms = roleSnap.data().permissions;
                    const canEdit = perms.canManageOrgs &&
                        ((perms.allowedOrgs || []).length === 0 || perms.allowedOrgs.includes(orgId));
                    if (canEdit) {
                        document.getElementById("editBtn").style.display = "flex";
                    }
                }
            }
        }

        window.toggleEditMode = (active) => {
            const fab = document.getElementById("editBtn");
            
            if (active) {
                document.body.classList.add("edit-mode-active");
                fab.style.display = "none";
            } else {
                document.body.classList.remove("edit-mode-active");
                fab.style.display = "flex";
                loadOrgDetails(); // Reset to current data
            }
        };

        async function uploadToCloudinary(file, folder = "organizations") {
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", UPLOAD_PRESET);
            formData.append("folder", folder);

            const res = await fetch(CLOUDINARY_URL, { method: "POST", body: formData });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.message || "Upload failed");
            return data.secure_url;
        }

        window.saveChanges = async () => {
            const saveBtn = document.getElementById("saveBtn");
            const originalText = saveBtn.textContent;
            saveBtn.disabled = true;
            saveBtn.textContent = "Saving...";

            try {
                let logoUrl = currentOrgData.icon || currentOrgData.logo;
                let coverUrl = currentOrgData.coverUrl || null;
                const logoFile = document.getElementById("editLogoInput").files[0];
                const coverFile = document.getElementById("editCoverInput").files[0];
                
                if (logoFile) {
                    saveBtn.textContent = "Uploading Logo...";
                    logoUrl = await uploadToCloudinary(logoFile, "organizations");
                }

                if (coverFile) {
                    saveBtn.textContent = "Uploading Cover...";
                    coverUrl = await uploadToCloudinary(coverFile, "org_covers");
                }

                const updates = {
                    name: document.getElementById("editName").value,
                    description: document.getElementById("editDescription").value,
                    category: document.getElementById("editCategory").value,
                    color: document.getElementById("editColor").value,
                    fb: document.getElementById("editFb").value,
                    yt: document.getElementById("editYt").value,
                    website: document.getElementById("editWebsite").value,
                    contactEmail: document.getElementById("editContactEmail").value,
                    joinLink: document.getElementById("editJoinLink").value,
                    icon: logoUrl,
                    logo: logoUrl,
                    coverUrl: coverUrl
                };

                await updateDoc(doc(db, "organizations", orgId), updates);
                toggleEditMode(false);
                loadOrgDetails();
                alert("Changes saved successfully!");
            } catch (err) {
                alert("Error saving changes: " + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = originalText;
            }
        };

        function toggleJoin(btn) {
            let joined = JSON.parse(localStorage.getItem("joinedOrgs") || "[]");
            if (joined.includes(orgId)) {
                joined = joined.filter(id => id !== orgId);
                btn.textContent = "Join Now";
                btn.classList.remove("btn-outline");
            } else {
                joined.push(orgId);
                btn.textContent = "Leave Organization";
                btn.classList.add("btn-outline");
            }
            localStorage.setItem("joinedOrgs", JSON.stringify(joined));
        }
    </script>
</body>

</html>
